# .github/workflows/build-artifacts.yml
name: Desktop build and release

# Desktop build and release workflow.
# Builds the Electron app for all four platforms (macOS arm64/x64, Windows x64, Linux x64),
# uploads each installer, generates electron-updater feeds and sidecar blockmaps,
# and publishes the release assets to GitHub Releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: false
        default: ""
      version:
        description: "Version string to stamp into the app (e.g. 0.31.1)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID || 'client_01KZ3VRKC374HS91XGRDPT3671' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            artifact: mac-arm64
          - os: macos-15-intel
            platform: darwin-x64
            artifact: mac-x64
          - os: windows-latest
            platform: win32-x64
            artifact: win
          - os: ubuntu-latest
            platform: linux-x64
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      # The daemon is compiled by build-daemon.mjs during premake, so the Go
      # toolchain must be present and pinned on every runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Verify WorkOS build configuration
        shell: bash
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_WORKOS_CLIENT_ID is required for desktop artifacts." >&2
            exit 1
          fi
      # Resolve the target version:
      # 1. From inputs.version (if workflow_dispatch)
      # 2. From git tag (if tag push)
      # 3. Fallback to package.json version
      - name: Resolve version
        shell: bash
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "main" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_VERSION="${{ github.ref_name }}"
            else
              RAW_VERSION="$(node -p 'require("./package.json").version')"
            fi
          fi
          VERSION="${RAW_VERSION#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"
      # Stamp the resolved version into package.json for this build,
      # dropping any +build metadata.
      - name: Stamp version
        shell: bash
        env:
          BUILD_VERSION: ${{ env.APP_VERSION }}
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      - name: Build
        shell: bash
        env:
          # Bake the update feed's owner/repo from the repo this build runs in.
          AO_RELEASE_REPO: ${{ github.repository }}
        run: npm run make
      - name: Verify baked update feed repo
        shell: bash
        run: |
          set -euo pipefail
          owner="$(sed -n 's/^owner:[[:space:]]*//p' app-update.yml)"
          repo="$(sed -n 's/^repo:[[:space:]]*//p' app-update.yml)"
          echo "baked feed: $owner/$repo (expected $GITHUB_REPOSITORY)"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::app-update.yml bakes $owner/$repo but this build publishes from $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Collect artifact and compute digest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ env.APP_VERSION }}
        run: |
          mkdir -p dist-artifact dist-digest
          case "$PLATFORM" in
            darwin-arm64)
              # maker-zip output: out/make/zip/darwin/<arch>/<name>-<version>.zip
              src="$(find out/make/zip/darwin -name '*.zip' | head -n1)"
              name="agent-orchestrator-$PLATFORM.zip"
              versioned="Agent.Orchestrator-$PLATFORM-$VERSION.zip"
              ;;
            darwin-x64)
              src="$(find out/make/zip/darwin -name '*.zip' | head -n1)"
              name="agent-orchestrator-$PLATFORM.zip"
              versioned="Agent.Orchestrator-$PLATFORM-$VERSION.zip"
              ;;
            win32-x64)
              # NSIS (electron-builder) output: out/make/<productName> Setup <version>.exe
              src="$(find out/make -maxdepth 1 -name '*Setup*.exe' | head -n1)"
              name="agent-orchestrator-win32-x64.exe"
              versioned="Agent.Orchestrator.Setup.$VERSION.exe"
              ;;
            linux-x64)
              # AppImage (electron-builder) output: out/make/<productName>-<version>.AppImage
              src="$(find out/make -maxdepth 1 -name '*.AppImage' | head -n1)"
              name="agent-orchestrator-linux-x64.AppImage"
              versioned="Agent.Orchestrator-$VERSION.AppImage"
              ;;
            *)
              echo "unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          if [ -z "$src" ]; then echo "no build output found for $PLATFORM" >&2; exit 1; fi
          cp "$src" "dist-artifact/$name"
          cp "$src" "dist-artifact/$versioned"
          hash="$(openssl dgst -sha256 "dist-artifact/$name" | awk '{print $NF}')"
          # Pinned digest contract: a flat filename -> sha256 hex map, merged
          # into one digests.json by the digests job below.
          jq -n --arg f "$name" --arg h "$hash" --arg vf "$versioned" \
            '{($f): $h, ($vf): $h}' > "dist-digest/$PLATFORM.digest.json"
          echo "$PLATFORM: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"

          # Collect dmg if produced
          src_dmg="$(find out/make -maxdepth 1 -name '*.dmg' | head -n1)"
          if [ -n "$src_dmg" ]; then
            cp "$src_dmg" "dist-artifact/Agent.Orchestrator-$PLATFORM.dmg"
          fi
      # The deb maker in forge.config.ts also runs on linux; capture its output
      # as a separate `linux-deb` artifact.
      - name: Collect Linux .deb and compute digest
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist-deb
          # maker-deb output: out/make/deb/x64/<name>_<version>_amd64.deb
          src="$(find out/make -name '*.deb' | head -n1)"
          if [ -z "$src" ]; then echo "no .deb output found" >&2; exit 1; fi
          name="agent-orchestrator-linux-x64.deb"
          cp "$src" "dist-deb/$name"
          hash="$(openssl dgst -sha256 "dist-deb/$name" | awk '{print $NF}')"
          jq --arg f "$name" --arg h "$hash" '. + {($f): $h}' \
            dist-digest/linux-x64.digest.json > dist-digest/linux-x64.digest.json.tmp
          mv dist-digest/linux-x64.digest.json.tmp dist-digest/linux-x64.digest.json
          echo "linux-x64: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux .deb artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: frontend/dist-deb/agent-orchestrator-linux-x64.deb
          retention-days: 1
          if-no-files-found: error
      # The rpm maker for Fedora/RHEL/openSUSE.
      - name: Collect Linux .rpm and compute digest
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist-rpm
          # maker-rpm output: out/make/rpm/x64/<name>-<version>-<revision>.x86_64.rpm
          src="$(find out/make -name '*.rpm' | head -n1)"
          if [ -z "$src" ]; then echo "no .rpm output found" >&2; exit 1; fi
          name="agent-orchestrator-linux-x64.rpm"
          cp "$src" "dist-rpm/$name"
          hash="$(openssl dgst -sha256 "dist-rpm/$name" | awk '{print $NF}')"
          jq --arg f "$name" --arg h "$hash" '. + {($f): $h}' \
            dist-digest/linux-x64.digest.json > dist-digest/linux-x64.digest.json.tmp
          mv dist-digest/linux-x64.digest.json.tmp dist-digest/linux-x64.digest.json
          echo "linux-x64: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux .rpm artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: frontend/dist-rpm/agent-orchestrator-linux-x64.rpm
          retention-days: 1
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/dist-artifact/*
          retention-days: 1
          if-no-files-found: error
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: frontend/dist-digest/${{ matrix.platform }}.digest.json
          retention-days: 1
          if-no-files-found: error

  # Merge the per-platform digest fragments into one digests.json artifact so
  # release consumers can verify every expected hash from a single file.
  digests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Merge digests
        shell: bash
        run: |
          jq -s 'add' ./*.digest.json > digests.json
          { echo '### Artifact digests'; echo '```json'; cat digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: digests.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, digests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Clean up intermediate digests
        shell: bash
        run: |
          rm -f dist/*.digest.json
      - name: Generate updater feeds and blockmaps
        shell: bash
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "main" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_VERSION="${{ github.ref_name }}"
            else
              RAW_VERSION="$(node -p 'require("./frontend/package.json").version')"
            fi
          fi
          VERSION="${RAW_VERSION#v}"
          echo "Generating feeds for version: $VERSION"
          node frontend/scripts/feed.mjs dist "$VERSION" latest
          echo "Directory contents after feed generation:"
          ls -la dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "main" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_VERSION="${{ github.ref_name }}"
            else
              RAW_VERSION="$(node -p 'require("./frontend/package.json").version')"
            fi
          fi
          VERSION="${RAW_VERSION#v}"
          TAG="v$VERSION"
          echo "Publishing release $TAG..."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist/* \
              --title "Agent Orchestrator $TAG" \
              --generate-notes
          fi
